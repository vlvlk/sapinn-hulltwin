name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint + types + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync environment
        run: uv sync --group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy src scripts tests

      - name: Pytest
        run: uv run pytest -q

  smoke:
    name: smoke: report + notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync environment
        run: uv sync --group dev --group notebooks

      - name: Report pipeline (reduced run)
        run: |
          uv run python scripts/generate_report.py \
            --days 180 --cleanings 60 130 --epochs 500 \
            --out reports/ci_smoke_report.png

      - name: Execute notebooks (Shifts data absent -> graceful skip)
        run: |
          uv run jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=1200 \
            notebooks/01_synthetic_id.ipynb notebooks/02_shifts_power.ipynb
